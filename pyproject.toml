[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-notary"
version = "0.1.0"
description = "Pre-install trust verification for MCP servers — procedencia, integridad y typosquatting detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "security", "devsecops", "llm", "supply-chain", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
]

[project.scripts]
mcp-notary = "mcp_notary.cli:app"

[project.urls]
Homepage = "https://sopitacasera.github.io"
Repository = "https://github.com/sopitacasera/mcp-notary"
Issues = "https://github.com/sopitacasera/mcp-notary/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["mcp_notary"]
